name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Unit tests
        run: yarn test

      - name: Build
        run: yarn build

      - name: Audit
        run: yarn audit --audit-level=high

      - name: SAST (semgrep)
        if: always()
        uses: returntocorp/semgrep-action@v1
        with:
          deployKey: ${{ secrets.SEMGREP_APP_TOKEN }}
          config: p/security-audit
